repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "master"]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.env\.example$

  # Ruff: linting + formatting (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Pyright: static type checker.
  # uv is not a hard requirement — a missing binary used to make this hook die with
  # exit 127, which silently disabled the type gate for anyone without uv installed.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c "cd backend && if command -v uv >/dev/null 2>&1; then uv run pyright; elif [ -x .venv/bin/pyright ]; then .venv/bin/pyright; elif [ -x .venv/Scripts/pyright.exe ]; then .venv/Scripts/pyright.exe; else echo pyright-unavailable-no-uv-and-no-venv-binary && exit 1; fi"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
